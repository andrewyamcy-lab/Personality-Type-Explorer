    function setText(id,key){const el=document.getElementById(id);if(el)el.textContent=t(key);}
    function setHTML(id,key){const el=document.getElementById(id);if(el)el.innerHTML=t(key);}
    function setPH(id,key){const el=document.getElementById(id);if(el)el.placeholder=t(key);}
    function toggleLang(){currentLang=currentLang==='zh'?'en':'zh';document.documentElement.lang=currentLang==='zh'?'zh-Hant':'en';applyLanguage();renderQuestions();updateProgress();}
    function applyLanguage(){
      setText('brandTitle','brandTitle');setText('brandSub','brandSub');setText('langBtn','langBtn');setText('heroBadge','heroBadge');setHTML('heroTitle','heroTitle');setText('startBtn','startBtn');setText('checkBtn','checkBtn');setText('homeNote','homeNote');setText('stat1','stat1');setText('stat2','stat2');setText('stat3','stat3');setText('stat4','stat4');
      setText('studentTitle','studentTitle');setText('studentDesc','studentDesc');setText('backHome1','back');setText('classLabel','classLabel');setText('classNoLabel','classNoLabel');setText('nameLabel','nameLabel');setText('studentNoLabel','studentNoLabel');setPH('className','classPH');setPH('classNo','classNoPH');setPH('studentName','namePH');setPH('studentNumber','studentNoPH');setText('nextBtn','nextBtn');
      setText('questionsTitle','questionsTitle');setText('questionsDesc','questionsDesc');setText('backInfoBtn','backInfo');setText('loadingText','loading');setText('submitBtn','submitBtn');setText('resultTitle','resultTitle');setText('resultDesc','resultDesc');setText('homeBtnResult','home');
      setText('recallTitle','recallTitle');setText('recallDesc','recallDesc');setText('backHome2','back');setText('recallLabel','studentNoLabel');setPH('recallStudentNumber','studentNoPH');setText('searchBtn','searchBtn');updateProgress();
    }

    function showPage(pageId){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(pageId).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(pageId==='questionsPage')updateProgress();}
    function goToQuestions(){const message=document.getElementById('studentInfoMessage');message.innerHTML='';if(!val('className')||!val('classNo')||!val('studentName')||!val('studentNumber')){message.innerHTML=`<div class="alert error">${t('completeInfo')}</div>`;return;}showPage('questionsPage');}
    function jsonp(url){return new Promise((resolve,reject)=>{const cb='jsonpCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);window[cb]=data=>{delete window[cb];script.remove();resolve(data);};const script=document.createElement('script');script.src=url+(url.includes('?')?'&':'?')+'callback='+cb;script.onerror=()=>{delete window[cb];script.remove();reject(new Error('Network error.'));};document.body.appendChild(script);});}
    async function loadTestData(){const container=document.getElementById('questionsContainer');try{const data=await jsonp(`${GAS_URL}?action=getTestData&v=${Date.now()}`);if(!data.ok)throw new Error(data.message||'Cannot load test data.');QUESTIONS=data.questions||[];RESULT_TYPES=data.resultTypes||{};renderQuestions();updateProgress();}catch(err){container.innerHTML=`<div class="alert error">${t('loadFail')}<br>${escapeHtml(err.message)}</div>`;}}
    function renderQuestions(){const container=document.getElementById('questionsContainer');if(!QUESTIONS.length){container.innerHTML=`<div class="alert error">${t('noQuestions')}</div>`;return;}container.innerHTML=QUESTIONS.map((q,i)=>{const main=currentLang==='zh'?q.questionZH:q.questionEN;const sub=currentLang==='zh'?q.questionEN:q.questionZH;return `<div class="q-card"><div class="q-head"><div class="q-num">${i+1}</div><div class="q-text"><h3>${escapeHtml(main)}</h3><p>${escapeHtml(sub)}</p></div></div><div class="scale">${[1,2,3,4,5].map(score=>`<label class="scale-option"><input type="radio" name="${escapeHtml(q.questionId)}" value="${score}" onchange="updateProgress()"><span class="face"><span>${emoji(score)}</span><span>${score}</span></span></label>`).join('')}</div></div>`}).join('');}
    function emoji(score){return {1:'😣',2:'🙁',3:'😐',4:'🙂',5:'🤩'}[score]||'⭐';}
    function updateProgress(){const total=QUESTIONS.length;let answered=0;QUESTIONS.forEach(q=>{if(document.querySelector(`input[name="${cssEscape(q.questionId)}"]:checked`))answered++;});const p=total?Math.round(answered/total*100):0;const el=document.getElementById('progressText');if(el)el.textContent=`${t('progress')} ${answered} / ${total}`;document.getElementById('progressPercent').textContent=`${p}%`;document.getElementById('progressFill').style.width=`${p}%`;}
    async function submitQuestionnaire(){const className=val('className'),classNo=val('classNo'),studentName=val('studentName'),studentNumber=val('studentNumber');const message=document.getElementById('submitMessage'),btn=document.getElementById('submitBtn');message.innerHTML='';if(!className||!classNo||!studentName||!studentNumber){message.innerHTML=`<div class="alert error">${t('completeInfo')}</div>`;showPage('studentInfoPage');return;}if(!QUESTIONS.length){message.innerHTML=`<div class="alert error">${t('notLoaded')}</div>`;return;}const answers={},scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};for(const q of QUESTIONS){const selected=document.querySelector(`input[name="${cssEscape(q.questionId)}"]:checked`);if(!selected){message.innerHTML=`<div class="alert error">${t('answerAll')}</div>`;return;}const value=Number(selected.value);answers[q.questionId]=value;if(scores[q.pole]!==undefined)scores[q.pole]+=value;}const personalityType=calculateType(scores),resultCode=generateResultCode(studentNumber),typeInfo=RESULT_TYPES[personalityType]||{};const result={className,classNo,studentName,studentNumber,resultCode,personalityType,scores,typeInfo};btn.disabled=true;message.innerHTML=`<div class="alert success">${t('saving')}<span class="dots"></span></div>`;try{await saveResultToGoogleSheet({className,classNo,studentName,studentNumber,resultCode,personalityType,answers,scores,result});document.getElementById('resultCodeBox').innerHTML=`<div class="alert success">${t('saved')}<br>${t('studentNo')}: <strong>${escapeHtml(studentNumber)}</strong><br>${t('resultCode')}: <strong>${escapeHtml(resultCode)}</strong><br>${t('checkLater')}</div>`;}catch(err){document.getElementById('resultCodeBox').innerHTML=`<div class="alert error">${t('saveFail')}<br>${escapeHtml(err.message)}</div>`;}finally{btn.disabled=false;message.innerHTML='';displayResult(result,'resultContainer');showPage('resultPage');}}
    function calculateType(scores){return (Number(scores.E)>=Number(scores.I)?'E':'I')+(Number(scores.S)>=Number(scores.N)?'S':'N')+(Number(scores.T)>=Number(scores.F)?'T':'F')+(Number(scores.J)>=Number(scores.P)?'J':'P');}
    async function saveResultToGoogleSheet(payload){const url=`${GAS_URL}?action=submitResult&payload=${encodeURIComponent(JSON.stringify(payload))}&v=${Date.now()}`;const data=await jsonp(url);if(!data.ok)throw new Error(data.message||'Save failed.');return data;}
    async function recallResult(){const studentNumber=val('recallStudentNumber');const message=document.getElementById('recallMessage'),container=document.getElementById('recallResultContainer');message.innerHTML='';container.innerHTML='';if(!studentNumber){message.innerHTML=`<div class="alert error">${t('enterStudentNo')}</div>`;return;}message.innerHTML=`<div class="alert success">${t('searching')}<span class="dots"></span></div>`;try{const data=await jsonp(`${GAS_URL}?action=recallResult&studentNumber=${encodeURIComponent(studentNumber)}&v=${Date.now()}`);if(!data.ok)throw new Error(data.message||'Search failed.');if(!data.result){message.innerHTML=`<div class="alert error">${t('notFound')}</div>`;return;}message.innerHTML=`<div class="alert success">${t('found')}</div>`;const r=data.result;const typeInfo=RESULT_TYPES[r.personalityType]||r.result?.typeInfo||{};displayResult({className:r.className,classNo:r.classNo,studentName:r.studentName,studentNumber:r.studentNumber,resultCode:r.resultCode,personalityType:r.personalityType,scores:r.scores,typeInfo},'recallResultContainer');}catch(err){message.innerHTML=`<div class="alert error">${escapeHtml(err.message)}</div>`;}}
    function displayResult(result,containerId){const c=document.getElementById(containerId),info=result.typeInfo||{},s=result.scores||{};const title=currentLang==='zh'?(info.titleZH||t('preference')):(info.titleEN||t('preference'));const desc=currentLang==='zh'?(info.descriptionZH||''):(info.descriptionEN||'');const reflection=currentLang==='zh'?(info.suggestedActionZH||''):(info.suggestedActionEN||info.suggestedActionZH||'');c.innerHTML=`<div class="result-hero"><span class="pill">💎 ${t('preference')}</span><div class="result-type">${escapeHtml(result.personalityType)}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(desc)}</p></div><div class="r-card"><h3>${t('studentInfo')}</h3><p>${t('name')}: ${escapeHtml(result.studentName||'')}<br>${t('studentNo')}: ${escapeHtml(result.studentNumber||'')}<br>${t('classText')}: ${escapeHtml(result.className||'')}<br>${t('classNo')}: ${escapeHtml(result.classNo||'')}</p></div><div class="r-card"><h3>${t('dimensionScores')}</h3><div class="score-grid">${renderPair('E','I',s,t('energy'))}${renderPair('S','N',s,t('information'))}${renderPair('T','F',s,t('decision'))}${renderPair('J','P',s,t('lifestyle'))}</div></div>${reflection?`<div class="r-card"><h3>${t('reflection')}</h3><p>${escapeHtml(reflection)}</p></div>`:''}<div class="note">${t('note')}</div>`;}
    function renderPair(a,b,scores,title){const A=Number(scores[a]||0),B=Number(scores[b]||0),total=A+B||1,p=Math.round(A/total*100),stronger=A>=B?a:b;return `<div class="score-card"><h3>${escapeHtml(title)}</h3><div class="score-line"><span>${a}: ${A}</span><span>${b}: ${B}</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><span class="stronger">${t('stronger')}: ${stronger}</span></div>`;}
    function generateResultCode(studentNumber){return `MBTI-${studentNumber}-${Math.floor(100000+Math.random()*900000)}`;}function val(id){return document.getElementById(id).value.trim();}function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}function cssEscape(v){return window.CSS&&CSS.escape?CSS.escape(v):String(v).replace(/[^a-zA-Z0-9_-]/g,'\\$&');}
  </script>
</body>
</html>
