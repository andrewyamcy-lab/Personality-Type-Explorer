  <script>
    const GAS_URL='https://script.google.com/macros/s/AKfycbx0glabj7RsKxvV2mWyhTeNBiWq7rFvTUpXJejeZyLuRjcRibpNSMeIH2ZIVPLwA6_u/exec';let QUESTIONS=[],RESULT_TYPES={},currentLang='zh',lastResult=null;
    const TEXT={zh:{brandTitle:'性格傾向探索',brandSub:'校園自我探索平台',langBtn:'English',heroBadge:'🍃 MBTI 性格傾向測驗',heroTitle:'探索你的<br><span class="grad">性格傾向</span>',startBtn:'🚀 開始測驗',checkBtn:'🔎 查看結果',homeNote:'請根據「平時自然傾向」作答，而不是選你覺得比較好的答案。結果會以 4 個字母顯示，例如 ENFJ、ISTP、ISFJ。',stat1:'傾向向度',stat2:'可能傾向',stat3:'平衡題目',stat4:'未來新增',studentTitle:'學生資料',studentDesc:'請先填寫學生資料，然後再進入題目頁面。',back:'← 返回',classLabel:'班別',classPH:'例如：2A',classNoLabel:'學號',classNoPH:'例如：12',nameLabel:'學生姓名',namePH:'例如：陳大文',studentNoLabel:'學生編號',studentNoPH:'例如：2026001',nextBtn:'下一步：開始題目 →',questionsTitle:'題目',questionsDesc:'1 = 非常不同意，5 = 非常同意。請按「平時自然傾向」作答。',backInfo:'← 返回學生資料',loading:'正在載入題目',submitBtn:'✨ 提交並查看傾向',resultTitle:'你的性格傾向',resultDesc:'你之後可以用學生編號重新查看最新結果。',home:'首頁',recallTitle:'查看結果',recallDesc:'輸入學生編號，系統會顯示你最新一次提交的結果。',searchBtn:'🔎 搜尋結果',progress:'已作答',completeInfo:'請先填寫所有學生資料。',noQuestions:'找不到已啟用的題目。',loadFail:'無法載入題目。請檢查 Apps Script 設定。',notLoaded:'題目尚未載入，請重新整理頁面。',answerAll:'請完成所有題目。',saving:'正在儲存結果',saved:'🎉 你的性格傾向結果已儲存。',studentNo:'學生編號',resultCode:'結果編號',checkLater:'之後可以用學生編號重新查看最新結果。',saveFail:'結果已產生，但儲存失敗。',enterStudentNo:'請輸入學生編號。',searching:'正在搜尋結果',notFound:'找不到結果，請檢查學生編號是否正確。',found:'已找到結果。',studentInfo:'學生資料',name:'姓名',classText:'班別',classNo:'學號',dimensionScores:'各向度分數',energy:'能量來源',information:'接收資訊',decision:'決策方式',lifestyle:'生活取向',stronger:'較明顯傾向',reflection:'建議反思',note:'提醒：結果只反映目前的傾向；活動建議只供參考，最重要是按自己的興趣選擇。',preference:'性格傾向',alphabetTitle:'字母意思',alphabetLead:'每個字母代表一個性格傾向向度：',alphabetNote:'提醒：字母只代表傾向，不代表能力高低或固定標籤。',closeTitle:'分數接近提醒',closeLead:'以下向度分數較接近，代表你的傾向可能會因情境而改變：',downloadCard:'下載結果卡',confidenceTitle:'結果信心度',activityTitle:'課外活動建議',activityLead:'根據你的性格傾向，以下活動可能較適合你作參考：'},en:{brandTitle:'Preference Tendency Explorer',brandSub:'School Self-Discovery Platform',langBtn:'中文',heroBadge:'🍃 MBTI-style Preference Reflection',heroTitle:'Discover your<br><span class="grad">preference tendency</span>',startBtn:'🚀 Start Test',checkBtn:'🔎 Check Result',homeNote:'Answer according to your natural tendency, not the answer you think is better. Your result will be shown as 4 letters, e.g. ENFJ, ISTP, ISFJ.',stat1:'Preference Dimensions',stat2:'Possible Tendencies',stat3:'Balanced Questions',stat4:'Future Add-on',studentTitle:'Student Information',studentDesc:'Complete your information first, then continue to the questions.',back:'← Back',classLabel:'Class',classPH:'e.g. 2A',classNoLabel:'Class No.',classNoPH:'e.g. 12',nameLabel:'Student Name',namePH:'e.g. Chan Tai Man',studentNoLabel:'Student Number',studentNoPH:'e.g. 2026001',nextBtn:'Next: Questions →',questionsTitle:'Questions',questionsDesc:'1 = Strongly Disagree, 5 = Strongly Agree. Answer according to your natural tendency.',backInfo:'← Back to Student Info',loading:'Loading questions',submitBtn:'✨ Submit & See Tendency',resultTitle:'Your Preference Tendency',resultDesc:'You can use your Student Number to check your latest result later.',home:'Home',recallTitle:'Check Result',recallDesc:'Enter your Student Number to view your latest submitted result.',searchBtn:'🔎 Search Result',progress:'Answered',completeInfo:'Please complete all student information first.',noQuestions:'No active questions found.',loadFail:'Cannot load questions. Please check Apps Script setup.',notLoaded:'Questions are not loaded yet. Please refresh the page.',answerAll:'Please answer all questions.',saving:'Saving result',saved:'🎉 Your preference tendency has been saved.',studentNo:'Student Number',resultCode:'Result Code',checkLater:'You can check your latest result with Student Number later.',saveFail:'Result was generated, but saving failed.',enterStudentNo:'Please enter Student Number.',searching:'Searching result',notFound:'No result found. Please check your Student Number.',found:'Result found.',studentInfo:'Student Info',name:'Name',classText:'Class',classNo:'Class No.',dimensionScores:'Dimension Scores',energy:'Energy',information:'Information',decision:'Decision',lifestyle:'Lifestyle',stronger:'Stronger tendency',reflection:'Suggested Reflection',note:'Reminder: This result describes a current preference tendency only. Activity recommendations are for reference only; your interests should come first.',preference:'Preference Tendency',alphabetTitle:'Letter Meanings',alphabetLead:'Each letter represents one preference dimension:',alphabetNote:'Reminder: letters show tendencies only, not ability level or fixed labels.',closeTitle:'Close Score Reminder',closeLead:'The following dimensions are close, which means your tendency may change depending on the situation:',downloadCard:'Download Result Card',confidenceTitle:'Result Confidence',activityTitle:'Activity Recommendations',activityLead:'Based on your preference tendency, these activities may be suitable as references:'}};
    const ACTIVITY={ISTJ:['圖書館服務團','班會內閣','數學學會','童軍'],ISFJ:['輔導領袖生','梁書義工團','醫療輔助隊（AMS）','圖書館服務團'],INFJ:['輔導領袖生','生涯規劃大使','梁書義工團','中文學會'],INTJ:['科技學會','影畫特效組','數學學會','科學學會'],ISTP:['科技學會','校園電視台','影畫特效組','乒乓球訓練班'],ISFP:['視覺藝術學會','舞蹈學會','烹飪學會','結他及電結他班'],INFP:['中文學會','English Society','戲劇組','視覺藝術學會'],INTP:['科學學會','數學學會','科技學會','圍棋 / 集橋牌'],ESTP:['足球小組','籃球隊','田徑隊','消防及救護青年團'],ESFP:['舞蹈學會','戲劇組','A cappella / 合唱團','烹飪學會'],ENFP:['學生會','戲劇組','綜合魔術雜耍','English Society'],ENTP:['遊樂會 / 桌遊學會','科技學會','學生會','綜合魔術雜耍'],ESTJ:['學生會','班會內閣','四社（忠、義、勤、儉）','梁書升旗隊'],ESFJ:['學生會','班會內閣','梁書義工團','合唱團'],ENFJ:['輔導領袖生','學生會','生涯規劃大使','梁書義工團'],ENTJ:['學生會','四社（忠、義、勤、儉）','班會內閣','校園電視台'],DEFAULT:['學生會','梁書義工團','English Society','視覺藝術學會']};
    document.addEventListener('DOMContentLoaded',()=>{applyLanguage();loadTestData();});function t(k){return TEXT[currentLang][k]||k}function setText(id,k){const e=document.getElementById(id);if(e)e.textContent=t(k)}function setHTML(id,k){const e=document.getElementById(id);if(e)e.innerHTML=t(k)}function setPH(id,k){const e=document.getElementById(id);if(e)e.placeholder=t(k)}function toggleLang(){currentLang=currentLang==='zh'?'en':'zh';document.documentElement.lang=currentLang==='zh'?'zh-Hant':'en';applyLanguage();renderQuestions();updateProgress();if(lastResult)displayResult(lastResult,'resultContainer')}
    function applyLanguage(){['brandTitle','brandSub','langBtn','heroBadge','startBtn','checkBtn','homeNote','stat1','stat2','stat3','stat4','studentTitle','studentDesc','classLabel','classNoLabel','nameLabel','studentNoLabel','nextBtn','questionsTitle','questionsDesc','loadingText','submitBtn','resultTitle','resultDesc','recallTitle','recallDesc','searchBtn'].forEach(id=>setText(id,id.replace('loadingText','loading')));setHTML('heroTitle','heroTitle');setText('backHome1','back');setText('backHome2','back');setText('backInfoBtn','backInfo');setText('homeBtnResult','home');setText('recallLabel','studentNoLabel');setPH('className','classPH');setPH('classNo','classNoPH');setPH('studentName','namePH');setPH('studentNumber','studentNoPH');setPH('recallStudentNumber','studentNoPH');updateProgress()}
    function showPage(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo({top:0,behavior:'smooth'});if(id==='questionsPage')updateProgress()}function val(id){return document.getElementById(id).value.trim()}function goToQuestions(){const m=document.getElementById('studentInfoMessage');m.innerHTML='';if(!val('className')||!val('classNo')||!val('studentName')||!val('studentNumber')){m.innerHTML=`<div class="alert error">${t('completeInfo')}</div>`;return}showPage('questionsPage')}
    function jsonp(url){return new Promise((res,rej)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*99999);window[cb]=d=>{delete window[cb];s.remove();res(d)};const s=document.createElement('script');s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;s.onerror=()=>{delete window[cb];s.remove();rej(new Error('Network error'))};document.body.appendChild(s)})}
    async function loadTestData(){const c=document.getElementById('questionsContainer');try{const d=await jsonp(`${GAS_URL}?action=getTestData&v=${Date.now()}`);if(!d.ok)throw new Error(d.message||'Cannot load');QUESTIONS=d.questions||[];RESULT_TYPES=d.resultTypes||{};renderQuestions();updateProgress()}catch(e){c.innerHTML=`<div class="alert error">${t('loadFail')}<br>${esc(e.message)}</div>`}}
    function renderQuestions(){const c=document.getElementById('questionsContainer');if(!QUESTIONS.length){c.innerHTML=`<div class="alert error">${t('noQuestions')}</div>`;return}c.innerHTML=QUESTIONS.map((q,i)=>{const main=currentLang==='zh'?q.questionZH:q.questionEN,sub=currentLang==='zh'?q.questionEN:q.questionZH;return `<div class="q-card"><div class="q-head"><div class="q-num">${i+1}</div><div class="q-text"><h3>${esc(main)}</h3><p>${esc(sub)}</p></div></div><div class="scale">${[1,2,3,4,5].map(n=>`<label class="scale-option"><input type="radio" name="${esc(q.questionId)}" value="${n}" onchange="updateProgress()"><span class="face"><span>${['','😣','🙁','😐','🙂','🤩'][n]}</span><span>${n}</span></span></label>`).join('')}</div></div>`}).join('')}
    function updateProgress(){const total=QUESTIONS.length;let ans=0;QUESTIONS.forEach(q=>{if(document.querySelector(`input[name="${css(q.questionId)}"]:checked`))ans++});const p=total?Math.round(ans/total*100):0;const a=document.getElementById('progressText'),b=document.getElementById('progressPercent'),f=document.getElementById('progressFill');if(a)a.textContent=`${t('progress')} ${ans} / ${total}`;if(b)b.textContent=p+'%';if(f)f.style.width=p+'%'}
    async function submitQuestionnaire(){const msg=document.getElementById('submitMessage'),btn=document.getElementById('submitBtn');msg.innerHTML='';if(!val('className')||!val('classNo')||!val('studentName')||!val('studentNumber')){msg.innerHTML=`<div class="alert error">${t('completeInfo')}</div>`;showPage('studentInfoPage');return}if(!QUESTIONS.length){msg.innerHTML=`<div class="alert error">${t('notLoaded')}</div>`;return}const answers={},scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};for(const q of QUESTIONS){const s=document.querySelector(`input[name="${css(q.questionId)}"]:checked`);if(!s){msg.innerHTML=`<div class="alert error">${t('answerAll')}</div>`;return}answers[q.questionId]=Number(s.value);if(scores[q.pole]!==undefined)scores[q.pole]+=Number(s.value)}const meta=analyze(scores);const result={className:val('className'),classNo:val('classNo'),studentName:val('studentName'),studentNumber:val('studentNumber'),resultCode:`MBTI-${val('studentNumber')}-${Math.floor(100000+Math.random()*900000)}`,personalityType:meta.personalityType,scores,typeInfo:RESULT_TYPES[meta.personalityType]||{},resultMeta:meta};btn.disabled=true;msg.innerHTML=`<div class="alert success">${t('saving')}<span class="dots"></span></div>`;try{await jsonp(`${GAS_URL}?action=submitResult&payload=${encodeURIComponent(JSON.stringify({...result,answers,result}))}&v=${Date.now()}`);document.getElementById('resultCodeBox').innerHTML=`<div class="alert success">${t('saved')}<br>${t('studentNo')}: <strong>${esc(result.studentNumber)}</strong><br>${t('resultCode')}: <strong>${esc(result.resultCode)}</strong><br>${t('checkLater')}</div>`}catch(e){document.getElementById('resultCodeBox').innerHTML=`<div class="alert error">${t('saveFail')}<br>${esc(e.message)}</div>`}finally{btn.disabled=false;msg.innerHTML='';displayResult(result,'resultContainer');showPage('resultPage')}}
    function analyze(s){let type='';const details=[['E','I'],['S','N'],['T','F'],['J','P']].map(([a,b])=>{const A=s[a]||0,B=s[b]||0,d=Math.abs(A-B),letter=A===B?'X':A>B?a:b;type+=letter;return{pair:a+'/'+b,a,b,A,B,diff:d,letter,tied:A===B,close:d<=3}});return{personalityType:type,details,confidence:details.some(x=>x.tied)?'low':details.some(x=>x.close)?'medium':'high'}}
    async function recallResult(){const n=val('recallStudentNumber'),m=document.getElementById('recallMessage'),c=document.getElementById('recallResultContainer');m.innerHTML='';c.innerHTML='';if(!n){m.innerHTML=`<div class="alert error">${t('enterStudentNo')}</div>`;return}m.innerHTML=`<div class="alert success">${t('searching')}<span class="dots"></span></div>`;try{const d=await jsonp(`${GAS_URL}?action=recallResult&studentNumber=${encodeURIComponent(n)}&v=${Date.now()}`);if(!d.ok)throw new Error(d.message||'Search failed');if(!d.result){m.innerHTML=`<div class="alert error">${t('notFound')}</div>`;return}m.innerHTML=`<div class="alert success">${t('found')}</div>`;const r=d.result;displayResult({className:r.className,classNo:r.classNo,studentName:r.studentName,studentNumber:r.studentNumber,resultCode:r.resultCode,personalityType:r.personalityType,scores:r.scores||{},typeInfo:RESULT_TYPES[r.personalityType]||r.result?.typeInfo||{},resultMeta:r.result?.resultMeta||null},'recallResultContainer')}catch(e){m.innerHTML=`<div class="alert error">${esc(e.message)}</div>`}}
    function displayResult(r,id){lastResult=r;const c=document.getElementById(id),info=r.typeInfo||{},meta=r.resultMeta||analyze(r.scores||{}),title=currentLang==='zh'?(info.titleZH||t('preference')):(info.titleEN||t('preference')),desc=currentLang==='zh'?(info.descriptionZH||''):(info.descriptionEN||''),reflection=currentLang==='zh'?(info.suggestedActionZH||''):(info.suggestedActionEN||info.suggestedActionZH||'');c.innerHTML=`<div class="result-hero"><span class="pill">🍃 ${t('preference')}</span><div class="result-type">${esc(r.personalityType)}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><div class="r-card"><h3>${t('studentInfo')}</h3><p>${t('name')}: ${esc(r.studentName||'')}<br>${t('studentNo')}: ${esc(r.studentNumber||'')}<br>${t('classText')}: ${esc(r.className||'')}<br>${t('classNo')}: ${esc(r.classNo||'')}</p></div>${alphabetCard()}${confidenceCard(meta)}<div class="r-card"><h3>${t('dimensionScores')}</h3><div class="score-grid">${pair('E','I',r.scores,t('energy'))}${pair('S','N',r.scores,t('information'))}${pair('T','F',r.scores,t('decision'))}${pair('J','P',r.scores,t('lifestyle'))}</div></div>${closeCard(r.scores,meta)}${reflection?`<div class="r-card"><h3>${t('reflection')}</h3><p>${esc(reflection)}</p></div>`:''}${activityCard(r.personalityType)}<div class="note">${t('note')}</div><div class="result-actions"><button class="primary" onclick="downloadResultCard()">⬇️ ${t('downloadCard')}</button></div>`}
    function alphabetCard(){const rows=currentLang==='zh'?[['E','外向傾向'],['I','內向傾向'],['S','實感傾向'],['N','直覺傾向'],['T','思考傾向'],['F','情感傾向'],['J','判斷傾向'],['P','知覺傾向']]:[['E','Extraversion'],['I','Introversion'],['S','Sensing'],['N','Intuition'],['T','Thinking'],['F','Feeling'],['J','Judging'],['P','Perceiving']];return `<div class="r-card"><h3>${t('alphabetTitle')}</h3><p>${t('alphabetLead')}</p><div class="activity-grid">${rows.map(x=>`<div class="activity-item"><strong>${x[0]} — ${x[1]}</strong><span>${t('alphabetNote')}</span></div>`).join('')}</div></div>`}
    function confidenceCard(m){const text=m.confidence==='high'?(currentLang==='zh'?'較高：四個向度都有較清晰分別。':'Higher: all dimensions show clearer differences.'):m.confidence==='low'?(currentLang==='zh'?'較低：部分向度分數相同，結果只供參考。':'Lower: some dimensions are tied, so use the result as a reference.'):currentLang==='zh'?'中等：部分向度較接近，結果可作參考。':'Medium: some dimensions are close, so use the result as a reference.';return `<div class="r-card"><h3>${t('confidenceTitle')}</h3><p>${text}</p></div>`}
    function pair(a,b,s,title){s=s||{};const A=Number(s[a]||0),B=Number(s[b]||0),p=Math.round(A/((A+B)||1)*100),strong=A===B?'X':A>B?a:b;return `<div class="score-card"><h3>${esc(title)}</h3><div class="score-line"><span>${a}: ${A}</span><span>${b}: ${B}</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><span class="stronger">${t('stronger')}: ${strong}</span></div>`}
    function closeCard(s,m){const items=(m.details||[]).filter(x=>x.diff<=3);if(!items.length)return'';return `<div class="r-card"><h3>${t('closeTitle')}</h3><p>${t('closeLead')}</p><ul class="close-list">${items.map(x=>`<li>${x.pair}: ${x.A} / ${x.B}</li>`).join('')}</ul></div>`}
    function activityCard(type){const key=String(type||'').replace(/X/g,''),list=ACTIVITY[type]||ACTIVITY[key]||ACTIVITY.DEFAULT;return `<div class="r-card"><h3>${t('activityTitle')}</h3><p>${t('activityLead')}</p><div class="activity-grid">${list.map((x,i)=>`<div class="activity-item"><strong>${i+1}. ${esc(x)}</strong><span>${currentLang==='zh'?'可作為拓展興趣和發掘潛能的參考選擇。':'A reference choice for exploring interests and potential.'}</span></div>`).join('')}</div></div>`}
    function downloadResultCard(){if(!lastResult)return;const r=lastResult,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1200;canvas.height=800;const g=ctx.createLinearGradient(0,0,1200,800);g.addColorStop(0,'#b9ecdf');g.addColorStop(.55,'#dff4c6');g.addColorStop(1,'#ffe1bd');ctx.fillStyle=g;ctx.fillRect(0,0,1200,800);ctx.fillStyle='rgba(255,255,255,.78)';round(ctx,80,70,1040,660,46);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#31523b';ctx.font='900 38px Arial';ctx.fillText(t('preference'),600,150);ctx.font='1000 150px Arial';ctx.fillStyle='#4f9f59';ctx.fillText(r.personalityType||'',600,310);ctx.font='800 32px Arial';ctx.fillStyle='#213547';ctx.fillText(`${r.studentName||''}  ${r.className||''} ${r.classNo||''}`,600,390);ctx.font='700 26px Arial';ctx.fillStyle='#48617a';ctx.fillText(`${t('studentNo')}: ${r.studentNumber||''}`,600,440);ctx.fillText(`${t('resultCode')}: ${r.resultCode||''}`,600,480);ctx.font='700 24px Arial';ctx.fillText('Preference Tendency Explorer｜School Self-Discovery Platform',600,690);const a=document.createElement('a');a.download=`${(r.studentName||r.studentNumber||'result').replace(/[\\/:*?"<>|]/g,'_')}_${r.personalityType||'result'}.png`;a.href=canvas.toDataURL('image/png');a.click()}
    function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function css(v){return window.CSS&&CSS.escape?CSS.escape(v):String(v).replace(/[^a-zA-Z0-9_-]/g,'\\$&')}
  </script>
